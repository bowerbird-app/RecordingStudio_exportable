# Dummy-host English override. Rails loads config/locales automatically, so this
# file wins over the gem's en.yml without any explicit load-path append. Proves
# the engine does not re-add its locales after the host (which would clobber this).
# Overrides only the not_found page nav title (rarely shown); page H1/subtitle
# stay on the gem English defaults so normal dummy UI assertions are unchanged.
en:
  recording_studio:
    exportable:
      tokens:
        not_found:
          nav_title: "HOST export expired nav"
